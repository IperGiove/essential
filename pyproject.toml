[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
esuls-pdf = "esuls.pdf.cli:app"

[project]
name = "esuls"
version = "0.2.4"
description = "Utility library for async database operations, HTTP requests, and parallel execution"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "IperGiove", email = "ipergiove@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# All dependencies (always installed)
dependencies = [
    "aiosqlite==0.22.1",
    "click>=8.1",
    "curl-cffi>=0.13.0",
    "fake-useragent>=2.2.0",
    "httpx[http2]>=0.28.1",
    "loguru>=0.7.3",
    "pillow>=12.0.0",
    "playwright>=1.58.0",
    "pypdf>=6.10.2",
    "python-magic>=0.4.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "tf-playwright-stealth>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/ipergiove/esuls"
Repository = "https://github.com/ipergiove/esuls"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/esuls/tests"]
filterwarnings = [
    "ignore::DeprecationWarning:aiosqlite",
]
